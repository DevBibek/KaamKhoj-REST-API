components:
  schemas:
    ApplicationList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        job:
          type: integer
        job_title:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - id
      - job
      - job_title
    StatusEnum:
      enum:
      - PENDING
      - REVIEWING
      - ACCEPTED
      - REJECTED
      type: string
      description: |-
        * `PENDING` - pending
        * `REVIEWING` - reviewing
        * `ACCEPTED` - accepted
        * `REJECTED` - rejected
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
      required:
      - access
      - email
      - password
      - refresh
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
